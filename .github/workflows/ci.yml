name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Show environment
        run: |
          python --version
          uname -a
          echo "Repo: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
      - name: Run checks
        run: |
          echo "Running basic validation..."
          test -f README.md && echo "README present"
          wc -l daily-contributions.txt || true
      - name: Summary
        run: echo "CI completed successfully"
