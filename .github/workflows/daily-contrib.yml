name: daily-contribution

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 12 daily commits
        run: |
          git config user.name "n1lokaDeep"
          git config user.email "kolyastrstr@gmail.com"
          for i in $(seq 1 12); do
            echo "$(date -u +%Y-%m-%d) commit $i" >> daily-contributions.txt
            git add daily-contributions.txt
            git commit -m "daily contribution $i"
          done
          git push
